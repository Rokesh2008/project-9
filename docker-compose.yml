services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project9
      POSTGRES_PASSWORD: project9
      POSTGRES_DB: project9
    volumes: ["project9_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project9"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai:
    build: ./services/ai
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://project9:project9@postgres:5432/project9?schema=public
      AI_SERVICE_URL: http://ai:8000
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      PERSISTENCE_DRIVER: postgres
      OFFICIAL_PROJECTION: "true"
      DEMO_MODE: "${DEMO_MODE:-false}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-true}"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET:-}"
      ADMIN_BOOTSTRAP_KEY: "${ADMIN_BOOTSTRAP_KEY:-}"
      INTEGRATION_API_KEY: "${INTEGRATION_API_KEY:-}"
      ENABLE_FREEZE_SCHEDULER: "${ENABLE_FREEZE_SCHEDULER:-true}"
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      ai: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports: ["127.0.0.1:5173:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
volumes:
  project9_pg:
