server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server_tokens off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://project9-api-381809967406.us-central1.run.app; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /health { access_log off; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; expires -1; }
  # expires emits cache headers without overriding inherited security headers.
  location /assets/ { try_files $uri =404; expires 1y; }
}
